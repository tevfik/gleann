[package]
name = "gleann_core_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.102"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
libc = "0.2"
serde_json = "1.0.149"
tokenizers = "0.23.1"

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }

