name: CI/CD

on:
  push:
    branches: [ "main", "lane/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the build jobs only read the repository and upload
# artifacts. `contents: write` is granted per job where a release is created
# or edited (publish-release), never workflow-wide.
permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: |
          set -o pipefail
          GOTOOLCHAIN=auto go test -v -race -timeout 20m $(go list ./... | grep -v /tests/benchmarks) 2>&1 | tee test.log
        shell: bash

      - name: Show failed tests
        if: failure()
        run: |
          if [ -f test.log ]; then
            grep -E "^(--- FAIL|FAIL|panic:)" test.log | head -9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            ctx=$(grep -B8 -E "^\s*--- FAIL|^panic:|timed out" test.log | head -160 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failure context::${ctx}"
          fi
        shell: bash

  # ── Pure Go builds (all platforms, no CGo) ──
  release-pure:
    name: Build Pure Go (${{ matrix.suffix }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
          - goos: windows
            goarch: arm64
            suffix: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Determine version
        id: version
        # Use short commit hash if not a tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build
          go build -ldflags "-s -w -X main.version=${VERSION}" -o build/gleann ./cmd/gleann

      - name: Compress binary
        run: |
          mkdir -p dist
          SRC="build/gleann"
          OUTNAME="gleann"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTNAME="gleann.exe"
          fi
          cp "${SRC}" "${OUTNAME}"
          SUFFIX="gleann-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${SUFFIX}.zip" "${OUTNAME}"
          else
            tar czf "dist/${SUFFIX}.tar.gz" "${OUTNAME}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1


  # ── EIF Runtime build (in-process BERT + BitNet, zero external dynamic libs) ──
  release-eif:
    name: Build EIF Runtime (${{ matrix.suffix }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential libgomp1
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake
          fi

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann-eif
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export CGO_CFLAGS="-fno-tree-vectorize -fmath-errno"
            export CGO_CXXFLAGS="-fno-tree-vectorize -fmath-errno"
            export CMAKE_C_FLAGS="-fno-tree-vectorize -fmath-errno"
          fi
          mkdir -p ext/bitllm.c/build
          cmake -B ext/bitllm.c/build -S ext/bitllm.c -DCMAKE_BUILD_TYPE=Release -DEIF_ENABLE_VULKAN=OFF -DCMAKE_C_FLAGS="-D_DARWIN_C_SOURCE=1 -D_POSIX_C_SOURCE=200809L $CMAKE_C_FLAGS"
          cmake --build ext/bitllm.c/build --target bitllm_static
          mkdir -p build
          go build -tags "eif" -ldflags "-s -w -X main.version=${VERSION}" -o build/gleann-eif ./cmd/gleann

      - name: Rename and compress binary
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX="gleann-eif-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          cp build/gleann-eif "dist/${SUFFIX}"
          tar czf "dist/${SUFFIX}.tar.gz" -C dist "${SUFFIX}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-eif-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1


  # ── FAISS + Tree-sitter build (Linux & macOS, requires CGo) ──
  release-full:
    name: Build Full (FAISS + Native) (${{ matrix.suffix }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Task
        shell: bash
        run: |
          # Pinned version and no remote installer piped into a root shell.
          GOTOOLCHAIN=auto go install github.com/go-task/task/v3/cmd/task@v3.54.0
          # `go install` already put the binary in $(go env GOPATH)/bin, which
          # differs per runner (Linux: /home/runner/go/bin, Apple Silicon
          # macOS: /Users/runner/go/bin) and is not on PATH by default. Export
          # that directory for the following steps instead of copying into
          # /usr/local/bin (which need not exist and needs sudo to create).
          task_bin="$(go env GOPATH)/bin"
          echo "${task_bin}" >> "$GITHUB_PATH"
          "${task_bin}/task" --version

      - name: Verify task is on PATH
        shell: bash
        run: |
          # Proves the $GITHUB_PATH entry works; the build step below calls
          # `task full` without an absolute path.
          set -euo pipefail
          command -v task
          task --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FAISS Dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            # Added libomp-dev and patchelf for Linux
            sudo apt-get install -y cmake build-essential libopenblas-dev libomp-dev swig patchelf
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # libomp openblas swig added for macOS CXX OpenMP compatibility (AppleClang missing it by default)
            brew install cmake libomp openblas swig
          fi

      - name: Build and install FAISS from source
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CC=/usr/bin/clang
            export CXX=/usr/bin/clang++
          fi
          git clone --depth 1 --branch v1.9.0 https://github.com/facebookresearch/faiss.git /tmp/faiss
          cd /tmp/faiss

          # macOS AppleClang doesn't bundle OpenMP. Tell CMake where libomp is.
          EXTRA_CMAKE_ARGS=()
          if [ "$RUNNER_OS" == "Linux" ]; then
            EXTRA_CMAKE_ARGS+=("-DCMAKE_C_FLAGS=-fno-tree-vectorize -fmath-errno")
            EXTRA_CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=-fno-tree-vectorize -fmath-errno")
          elif [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA_CMAKE_ARGS+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          fi

          cmake -B build \
            -DFAISS_ENABLE_GPU=OFF \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DFAISS_ENABLE_C_API=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            "${EXTRA_CMAKE_ARGS[@]}"
          
          NCORES=2
          if [ "$RUNNER_OS" == "Linux" ]; then
            NCORES=$(nproc)
          elif [ "$RUNNER_OS" == "macOS" ]; then
            NCORES=$(sysctl -n hw.logicalcpu)
          fi
          
          cmake --build build -j$NCORES -- faiss faiss_c
          sudo cmake --install build

          # Build FAISS C API wrapper (not built by cmake)
          cd /tmp/faiss
          if [ "$RUNNER_OS" == "Linux" ]; then
            g++ -shared -fPIC -fno-tree-vectorize -fmath-errno -Wl,-rpath,'$ORIGIN' -o libfaiss_c.so \
              c_api/*.cpp \
              -I. -I/usr/local/include \
              -L/usr/local/lib -lfaiss \
              -lstdc++ -lgomp -lopenblas
            sudo cp libfaiss_c.so /usr/local/lib/
            sudo mkdir -p /usr/local/include/faiss/c_api/impl
            sudo cp c_api/*.h /usr/local/include/faiss/c_api/
            sudo cp c_api/impl/*.h /usr/local/include/faiss/c_api/impl/
            sudo ldconfig
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Using Accelerate framework + libomp for OpenMP support
            clang++ -shared -fPIC -Wl,-rpath,@loader_path -o libfaiss_c.dylib \
              c_api/*.cpp \
              -I. -I/usr/local/include \
              -Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include \
              -L/usr/local/lib -lfaiss \
              -L$(brew --prefix libomp)/lib -lomp \
              -lc++ -framework Accelerate
            sudo cp libfaiss_c.dylib /usr/local/lib/
            sudo mkdir -p /usr/local/include/faiss/c_api/impl
            sudo cp c_api/*.h /usr/local/include/faiss/c_api/
            sudo cp c_api/impl/*.h /usr/local/include/faiss/c_api/impl/
          fi

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann-full (FAISS + Tree-sitter + Native)
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LD_LIBRARY_PATH: "/usr/local/lib"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CGO_CXXFLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
            export CGO_LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
          else
            export CGO_CFLAGS="-fno-tree-vectorize -fmath-errno"
            export CGO_CXXFLAGS="-fno-tree-vectorize -fmath-errno"
          fi
          task full FAISS_LIB_DIR=/usr/local/lib FAISS_INC_DIR=/usr/local/include

      - name: Rename and compress binary
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX="gleann-full-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          # 1. Standalone single executable (zero external dependencies, self-extracting runtime)
          cp build/gleann-full "dist/${SUFFIX}"
          # 2. Compressed archive
          tar czf "dist/${SUFFIX}.tar.gz" -C dist "${SUFFIX}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-full-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1

  # ── kuzu-memory-export (v1.9 memory entity exporter, nested module, CGo) ──
  # gleann itself has no Kùzu since v1.20; this one-shot tool reads the
  # <name>_memory Kùzu stores of v1.9.x so `gleann memory import-graph` can load
  # them (docs/memory_engine.md, "Upgrading entities from v1.9"). go-kuzu links
  # its bundled libkuzu dynamically, so the archive carries the library next to
  # the binary and the binary looks for it there ($ORIGIN / @loader_path).
  # go-kuzu ships no Windows build that gleann used, hence no Windows asset.
  release-kuzu-memory-export:
    name: Build kuzu-memory-export (${{ matrix.suffix }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
            lib: libkuzu.so
            rpath: "$ORIGIN"
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
            lib: libkuzu.so
            rpath: "$ORIGIN"
          - os: macos-latest
            suffix: darwin-arm64
            lib: libkuzu.dylib
            rpath: "@loader_path"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build kuzu-memory-export
        shell: bash
        env:
          CGO_ENABLED: "1"
          RPATH: ${{ matrix.rpath }}
        working-directory: tools/kuzu-memory-export
        run: |
          mkdir -p build
          GOTOOLCHAIN=auto go build -trimpath -ldflags "-s -w -extldflags '-Wl,-rpath,${RPATH}'" -o build/kuzu-memory-export .
          # The library go-kuzu links against, from the module cache.
          KUZU_DIR=$(GOTOOLCHAIN=auto go list -m -f '{{.Dir}}' github.com/kuzudb/go-kuzu)
          case "${{ matrix.suffix }}" in
            linux-amd64)  LIBDIR="${KUZU_DIR}/lib/dynamic/linux-amd64" ;;
            linux-arm64)  LIBDIR="${KUZU_DIR}/lib/dynamic/linux-arm64" ;;
            darwin-arm64) LIBDIR="${KUZU_DIR}/lib/dynamic/darwin" ;;
          esac
          cp "${LIBDIR}/${{ matrix.lib }}" build/
          chmod 0644 "build/${{ matrix.lib }}"

      - name: Smoke test with only the bundled library
        # Move the binary and library away from the module cache path baked in
        # by go-kuzu's own rpath, so the run proves the bundled copy is found.
        shell: bash
        run: |
          SMOKE="${RUNNER_TEMP}/kme-smoke"
          mkdir -p "${SMOKE}"
          cp tools/kuzu-memory-export/build/* "${SMOKE}/"
          KUZU_DIR=$(cd tools/kuzu-memory-export && GOTOOLCHAIN=auto go list -m -f '{{.Dir}}' github.com/kuzudb/go-kuzu)
          chmod -R u+w "$(dirname "${KUZU_DIR}")" 2>/dev/null || true
          mv "${KUZU_DIR}" "${KUZU_DIR}.hidden"
          set +e
          (cd / && "${SMOKE}/kuzu-memory-export" -h >/dev/null 2>&1)
          status=$?
          set -e
          mv "${KUZU_DIR}.hidden" "${KUZU_DIR}"
          # -h prints the usage and exits 0 once the dynamic loader has found libkuzu.
          if [ "$status" -ne 0 ]; then
            echo "::error::kuzu-memory-export did not start with the bundled ${{ matrix.lib }} (exit ${status})"
            exit 1
          fi

      - name: Compress binary and library
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX="kuzu-memory-export-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          tar czf "dist/${SUFFIX}.tar.gz" -C tools/kuzu-memory-export/build kuzu-memory-export "${{ matrix.lib }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuzu-memory-export-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1

  # ── Only publish to GitHub Releases for tags ──
  publish-release:
    name: Publish Release
    needs: [release-pure, release-eif, release-full, release-kuzu-memory-export]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Creates the release, removes stale assets and edits the release body.
    permissions:
      contents: write
    steps:
      # Check out first: checkout cleans the workspace, which would delete the
      # artifacts downloaded below.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Hand-written notes live in docs/releases/<tag>.md. Without such a file
      # the notes are generated from the commits.
      - name: Pick release notes
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # Re-pushing a tag (a release rebuilt on a newer commit) must replace the
      # published binaries: the upload action leaves assets that already exist
      # under the same name untouched, so a rebuilt release would keep serving the
      # old files under new notes.
      - name: Remove stale assets of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                echo "removing stale asset: $asset"
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done
          fi

      # `gleann update` and `gleann plugin update` verify downloads against this.
      - name: Write SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

      # The upload action keeps the body of a release that already exists, so a
      # re-pushed tag would serve the new binaries under the old notes. Set the
      # body from the tagged notes file every time (a no-op on a new release).
      - name: Update release notes of an existing release
        if: steps.notes.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"

  # ── `go install ...@<tag>` must work and report the tag ──────
  # The path a user takes: go install github.com/tevfik/gleann/cmd/gleann@vX.Y.Z.
  # Runs after publish-release so the tag is public; go install fetches the
  # module through the Go proxy and needs no checkout here.
  #
  # Proxy negative caching — read before changing the retry strategy:
  # * proxy.golang.org caches "version not found" (HTTP 404) for 10-30 minutes
  #   (golang/go#33615). A `go install` issued before the proxy has crawled a
  #   brand-new tag therefore does not fail once, it poisons the cache for the
  #   rest of the run: sleeping 15 s and retrying four times (45 s) can never
  #   succeed, and every later attempt in the same run hits the cached 404.
  # * Hence the ordering: (1) wait until GitHub itself serves the tag ref
  #   (git ls-remote); (2) wait until proxy.golang.org serves
  #   /@v/<tag>.info with HTTP 200 — that first request is the warm-up that
  #   makes the proxy fetch the tag behind it; (3) only then run `go install`.
  #   Attempt 1 is what matters; the extra attempts only absorb a slow CDN
  #   edge for a version the proxy has already stored.
  # * The GOPRIVATE fallback is the last resort, not a substitute for waiting:
  #   with `GOPRIVATE=github.com/tevfik/gleann` cmd/go skips the proxy for this
  #   module and clones it over git, but plain `GOPROXY=direct` would also send
  #   every dependency through a fresh git clone, and GOSUMDB (sum.golang.org)
  #   resolves the module through proxy.golang.org's index, failing closed on a
  #   cached 404 ("verifying module: ... 404"). GOPRIVATE sets GONOPROXY *and*
  #   GONOSUMDB for the one path, so dependencies keep the proxy and their
  #   checksum verification while gleann itself is fetched directly; its
  #   authenticity then rests on the git tag ref GitHub served above. The
  #   direct path also rescues the case where an earlier, unrelated run already
  #   cached the 404 before this workflow ever started.
  # * Known limitation, not fixable here: proxy.golang.org and sum.golang.org
  #   never invalidate a tag that was deleted and re-pushed onto a new commit.
  #   The proxy keeps serving the first commit it crawled and the checksum DB
  #   keeps the first hash, so `go install @<tag>` can fail with a checksum
  #   mismatch or silently install the older commit although the GitHub tag
  #   moved. publish-release still supports re-pushed tags for the release
  #   assets; on the module path, cut a new version instead of moving a tag.
  verify-go-install:
    name: Verify go install @${{ github.ref_name }}
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # ~2 min (tag on GitHub) + ~4 min (proxy warm-up) + ~3 min (two build
    # attempts / the direct fallback) leaves headroom below this limit.
    timeout-minutes: 20
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Wait for the tag on GitHub, then on the module proxy
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1) GitHub must serve the tag ref. The workflow is triggered by the
          # tag push, so this is normally immediate; it also guards against a
          # stale CDN edge answering before the ref is readable.
          for attempt in $(seq 1 8); do
            if git ls-remote --exit-code --tags "https://github.com/${REPO}.git" \
                 "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "tag ${TAG} is visible on github.com/${REPO}"
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "::error::tag ${TAG} is not visible on github.com/${REPO} after ~2 minutes"
              exit 1
            fi
            echo "tag ${TAG} not visible on GitHub yet (attempt ${attempt}/8); waiting 15s"
            sleep 15
          done

          # 2) Pre-warm the proxy. The FIRST request for a version is what makes
          # proxy.golang.org crawl the tag, so issue it here (curl) instead of
          # letting `go install` be the first query — that query's 404 is the
          # one cached for 10-30 minutes. The module path is all lowercase, so
          # it maps to the proxy URL unchanged. ~4 minutes of backoff in total.
          url="https://proxy.golang.org/github.com/tevfik/gleann/@v/${TAG}.info"
          for attempt in $(seq 1 10); do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "${url}" 2>/dev/null || true)"
            code="${code:-000}"
            if [ "${code}" = "200" ]; then
              echo "proxy.golang.org serves ${TAG}"
              echo "PROXY_TAG_READY=true" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "${attempt}" -eq 10 ]; then
              echo "::warning::proxy.golang.org still returns ${code} for ${TAG} after ~4 minutes; the install step skips the proxy and goes direct"
              echo "PROXY_TAG_READY=false" >> "$GITHUB_ENV"
              exit 0
            fi
            case "${attempt}" in
              1) delay=10 ;;
              2) delay=15 ;;
              3) delay=20 ;;
              *) delay=30 ;;
            esac
            echo "proxy.golang.org returns ${code} for ${TAG} (attempt ${attempt}/10); waiting ${delay}s"
            sleep "${delay}"
          done

      - name: go install the tagged module (pure Go)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOBIN="$(mktemp -d)"
          echo "GOBIN=${GOBIN}" >> "$GITHUB_ENV"
          pkg="github.com/tevfik/gleann/cmd/gleann@${TAG}"

          # Attempt 1 happens only after the previous step saw the proxy serve
          # <tag>.info, so it cannot poison the negative cache. The second
          # attempt (30 s later) only covers a lagging edge node.
          if [ "${PROXY_TAG_READY:-false}" = "true" ]; then
            for delay in 0 30; do
              if [ "${delay}" -gt 0 ]; then
                sleep "${delay}"
              fi
              if go install "${pkg}"; then
                echo "installed ${pkg} through proxy.golang.org"
                exit 0
              fi
              echo "::warning::go install ${pkg} failed through proxy.golang.org"
            done
          else
            echo "::warning::skipping proxy.golang.org (it did not serve ${TAG} yet); going direct"
          fi

          # Last resort: bypass the proxy for gleann only. GOPRIVATE sets
          # GONOPROXY and GONOSUMDB for this one module path, so cmd/go clones
          # the repo over git instead of asking proxy.golang.org (whose negative
          # cache is still warm) and skips the sum.golang.org lookup that would
          # resolve through that same cache. Every dependency still comes from
          # proxy.golang.org and keeps its checksum verification; authenticity of
          # gleann itself rests on the git tag ref seen in the previous step.
          export GOPROXY="https://proxy.golang.org,direct"
          export GOPRIVATE=github.com/tevfik/gleann
          if go install "${pkg}"; then
            echo "installed ${pkg} with GOPRIVATE=github.com/tevfik/gleann (proxy.golang.org negative cache still warm)"
            exit 0
          fi

          echo "::error::go install ${pkg} failed through proxy.golang.org and with GOPRIVATE (direct VCS)"
          exit 1

      - name: Version reports the tag, not dev
        shell: bash
        run: |
          set -euo pipefail
          got="$("${GOBIN}/gleann" version)"
          want="gleann ${GITHUB_REF_NAME}"
          echo "got:  ${got}"
          echo "want: ${want}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::version mismatch: got '${got}', want '${want}' (a go install binary must report its tag via debug.ReadBuildInfo, not 'dev')"
            exit 1
          fi

      - name: Lexical index and search smoke (offline)
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          export GLEANN_CONFIG_DIR="${WORK}/config"
          export GLEANN_INDEX_DIR="${WORK}/indexes"
          mkdir -p "${WORK}/docs"
          printf 'gleann lexical smoke test alpha beta gamma\n' > "${WORK}/docs/notes.txt"

          "${GOBIN}/gleann" index build smoke --docs "${WORK}/docs" \
            --lexical-only --no-plugins --progress none
          "${GOBIN}/gleann" search smoke "lexical smoke" --json > "${WORK}/results.json"
          grep -q "lexical smoke" "${WORK}/results.json"
