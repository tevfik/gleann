name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: |
          set -o pipefail
          GOTOOLCHAIN=auto go test -v -race -timeout 8m $(go list ./... | grep -v /tests/benchmarks) 2>&1 | tee test.log
        shell: bash

      - name: Show failed tests
        if: failure()
        run: |
          if [ -f test.log ]; then
            grep -E "^(--- FAIL|FAIL|panic:)" test.log | head -9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            ctx=$(grep -B8 -E "^\s*--- FAIL|^panic:|timed out" test.log | head -160 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failure context::${ctx}"
          fi
        shell: bash

  # ── Pure Go builds (all platforms, no CGo) ──
  release-pure:
    name: Build Pure Go (${{ matrix.suffix }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
          - goos: windows
            goarch: arm64
            suffix: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        # Use short commit hash if not a tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: task build

      - name: Compress binary
        run: |
          mkdir -p dist
          SRC="build/gleann"
          OUTNAME="gleann"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTNAME="gleann.exe"
          fi
          cp "${SRC}" "${OUTNAME}"
          SUFFIX="gleann-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${SUFFIX}.zip" "${OUTNAME}"
          else
            tar czf "dist/${SUFFIX}.tar.gz" "${OUTNAME}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1


  # ── EIF Runtime build (in-process BERT + BitNet, zero external dynamic libs) ──
  release-eif:
    name: Build EIF Runtime (${{ matrix.suffix }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential libgomp1
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake
          fi

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann-eif
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export CGO_CFLAGS="-fno-tree-vectorize -fmath-errno"
            export CGO_CXXFLAGS="-fno-tree-vectorize -fmath-errno"
            export CMAKE_C_FLAGS="-fno-tree-vectorize -fmath-errno"
          fi
          task build-eif

      - name: Rename and compress binary
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX="gleann-eif-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          cp build/gleann-eif "dist/${SUFFIX}"
          tar czf "dist/${SUFFIX}.tar.gz" -C dist "${SUFFIX}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-eif-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1


  # ── FAISS + Tree-sitter build (Linux & macOS, requires CGo) ──
  release-full:
    name: Build Full (FAISS + Native) (${{ matrix.suffix }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FAISS Dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            # Added libomp-dev and patchelf for Linux
            sudo apt-get install -y cmake build-essential libopenblas-dev libomp-dev swig patchelf
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # libomp openblas swig added for macOS CXX OpenMP compatibility (AppleClang missing it by default)
            brew install cmake libomp openblas swig
          fi

      - name: Build and install FAISS from source
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CC=/usr/bin/clang
            export CXX=/usr/bin/clang++
          fi
          git clone --depth 1 --branch v1.9.0 https://github.com/facebookresearch/faiss.git /tmp/faiss
          cd /tmp/faiss

          # macOS AppleClang doesn't bundle OpenMP. Tell CMake where libomp is.
          EXTRA_CMAKE_ARGS=()
          if [ "$RUNNER_OS" == "Linux" ]; then
            EXTRA_CMAKE_ARGS+=("-DCMAKE_C_FLAGS=-fno-tree-vectorize -fmath-errno")
            EXTRA_CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=-fno-tree-vectorize -fmath-errno")
          elif [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA_CMAKE_ARGS+=("-DOpenMP_ROOT=$(brew --prefix libomp)")
          fi

          cmake -B build \
            -DFAISS_ENABLE_GPU=OFF \
            -DFAISS_ENABLE_PYTHON=OFF \
            -DFAISS_ENABLE_C_API=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            "${EXTRA_CMAKE_ARGS[@]}"
          
          NCORES=2
          if [ "$RUNNER_OS" == "Linux" ]; then
            NCORES=$(nproc)
          elif [ "$RUNNER_OS" == "macOS" ]; then
            NCORES=$(sysctl -n hw.logicalcpu)
          fi
          
          cmake --build build -j$NCORES -- faiss faiss_c
          sudo cmake --install build

          # Build FAISS C API wrapper (not built by cmake)
          cd /tmp/faiss
          if [ "$RUNNER_OS" == "Linux" ]; then
            g++ -shared -fPIC -fno-tree-vectorize -fmath-errno -Wl,-rpath,'$ORIGIN' -o libfaiss_c.so \
              c_api/*.cpp \
              -I. -I/usr/local/include \
              -L/usr/local/lib -lfaiss \
              -lstdc++ -lgomp -lopenblas
            sudo cp libfaiss_c.so /usr/local/lib/
            sudo mkdir -p /usr/local/include/faiss/c_api/impl
            sudo cp c_api/*.h /usr/local/include/faiss/c_api/
            sudo cp c_api/impl/*.h /usr/local/include/faiss/c_api/impl/
            sudo ldconfig
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Using Accelerate framework + libomp for OpenMP support
            clang++ -shared -fPIC -Wl,-rpath,@loader_path -o libfaiss_c.dylib \
              c_api/*.cpp \
              -I. -I/usr/local/include \
              -Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include \
              -L/usr/local/lib -lfaiss \
              -L$(brew --prefix libomp)/lib -lomp \
              -lc++ -framework Accelerate
            sudo cp libfaiss_c.dylib /usr/local/lib/
            sudo mkdir -p /usr/local/include/faiss/c_api/impl
            sudo cp c_api/*.h /usr/local/include/faiss/c_api/
            sudo cp c_api/impl/*.h /usr/local/include/faiss/c_api/impl/
          fi

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gleann-full (FAISS + Tree-sitter + Native)
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LD_LIBRARY_PATH: "/usr/local/lib"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CGO_CXXFLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
            export CGO_LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
          else
            export CGO_CFLAGS="-fno-tree-vectorize -fmath-errno"
            export CGO_CXXFLAGS="-fno-tree-vectorize -fmath-errno"
          fi
          task full FAISS_LIB_DIR=/usr/local/lib FAISS_INC_DIR=/usr/local/include

      - name: Rename and compress binary
        shell: bash
        run: |
          mkdir -p dist
          SUFFIX="gleann-full-${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          # 1. Standalone single executable (zero external dependencies, self-extracting runtime)
          cp build/gleann-full "dist/${SUFFIX}"
          # 2. Compressed archive
          tar czf "dist/${SUFFIX}.tar.gz" -C dist "${SUFFIX}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gleann-full-${{ matrix.suffix }}
          path: dist/*
          retention-days: 1

  # ── Only publish to GitHub Releases for tags ──
  publish-release:
    name: Publish Release
    needs: [release-pure, release-eif, release-full]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Check out first: checkout cleans the workspace, which would delete the
      # artifacts downloaded below.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Hand-written notes live in docs/releases/<tag>.md. Without such a file
      # the notes are generated from the commits.
      - name: Pick release notes
        id: notes
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # Re-pushing a tag (a release rebuilt on a newer commit) must replace the
      # published binaries: the upload action leaves assets that already exist
      # under the same name untouched, so a rebuilt release would keep serving the
      # old files under new notes.
      - name: Remove stale assets of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                echo "removing stale asset: $asset"
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done
          fi

      # `gleann update` and `gleann plugin update` verify downloads against this.
      - name: Write SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
