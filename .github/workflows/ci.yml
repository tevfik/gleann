name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repository. Artifacts are
# uploaded within the same run, Codecov uses its own token, and nothing
# creates releases, pushes or comments.
permissions:
  contents: read

jobs:
  # ── Cross-Platform Build & Test ──────────────────────────────
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.25"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration, default tags)
        # pkg/gleann alone takes about 8 minutes under -race on a hosted runner;
        # the whole step took 29-32 minutes on macOS and Linux runners in 2026-11.
        timeout-minutes: 40
        run: |
          set -o pipefail
          COVER_FLAG="-coverprofile=coverage.out"
          RACE_FLAG="-race"
          if [ "$RUNNER_OS" == "Windows" ]; then
            COVER_FLAG=""
            RACE_FLAG=""
          fi
          GOTOOLCHAIN=auto go test -v $RACE_FLAG -timeout 20m $COVER_FLAG $(go list ./... | grep -v /tests/benchmarks) 2>&1 | tee test.log
        shell: bash

      - name: Retrieval quality gate (no race detector)
        # The gate skips itself under -race (too slow); Windows already ran it above without -race.
        if: matrix.os != 'windows-latest'
        timeout-minutes: 3
        run: GOTOOLCHAIN=auto go test -count=1 -v -run TestRetrievalQuality ./internal/quality
        shell: bash

      - name: Show failed tests
        if: failure()
        run: |
          if [ -f test.log ]; then
            # Surface the failing tests as annotations so they show up on the
            # run page and in the checks API without downloading the log.
            grep -E "^(--- FAIL|FAIL|panic:)" test.log | head -9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            # One more annotation with the output that led up to each failure.
            # (GitHub shows at most 10 annotations per step, hence one block.)
            ctx=$(grep -B8 -E "^\s*--- FAIL" test.log | head -160 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failure context::${ctx}"
            echo "::group::Last 200 lines of test.log"
            tail -n 200 test.log
            echo "::endgroup::"
          fi
        shell: bash

      - name: Upload Test Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-log-${{ matrix.os }}
          path: test.log

      - name: Test (unit, treesitter tag)
        # Runs the graph, graph store and indexing packages with CGo and the
        # `treesitter` build tag, which adds the tree-sitter parsers (CALLS
        # for non-Go languages). The default-tag run above covers the same
        # packages without them; this pass covers the tree-sitter
        # extraction, query and heuristics code paths.
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: GOTOOLCHAIN=auto CGO_ENABLED=1 go test -tags treesitter -race -timeout 8m -coverprofile=coverage-ts.out ./internal/graph/... ./internal/graphstore/... ./internal/indexing/...
        shell: bash

      - name: Test (unit, treesitter tag — modules/chunking)
        # modules/chunking is a package of the root module; run it with the tag.
        if: matrix.os != 'windows-latest'
        timeout-minutes: 10
        run: |
          GOTOOLCHAIN=auto CGO_ENABLED=1 go test -tags treesitter -race -timeout 8m -coverprofile=coverage-chunking.out ./modules/chunking/...
        shell: bash

      - name: Test (modules/settings)
        # The settings registry plugins import; a separate module (stdlib only).
        if: matrix.os != 'windows-latest'
        timeout-minutes: 5
        run: |
          cd modules/settings
          GOTOOLCHAIN=auto go test -race -timeout 4m ./...
        shell: bash

      - name: Test (bench/graphdb, SQLite reference only)
        # The graph database benchmark harness is a nested module; its Kùzu
        # adapter needs CGo and the `kuzu` tag and is not built here.
        if: matrix.os != 'windows-latest'
        timeout-minutes: 5
        run: |
          cd bench/graphdb
          GOTOOLCHAIN=auto CGO_ENABLED=0 go test -timeout 4m ./...
        shell: bash

      - name: Test (bench/vectordb) and recall gate
        # The vector benchmark harness is a nested module. The gate builds
        # 10,000-vector HNSW and DiskANN indexes and a gleann index, and fails
        # when recall@10 drops below the thresholds in bench/vectordb/gate
        # (no race detector: the numbers, not the interleavings, are tested).
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 20
        run: |
          cd bench/vectordb
          GOTOOLCHAIN=auto CGO_ENABLED=0 go test -short -timeout 5m ./...
          GOTOOLCHAIN=auto CGO_ENABLED=0 go test -count=1 -v -timeout 15m -run TestRecallGate ./gate/
        shell: bash

      - name: Build and test (tools/kuzu-memory-export, CGo)
        # Exporter of v1.9 Kùzu memory stores; a nested module with the Kùzu
        # binding, so the main module and the other jobs never compile it.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          cd tools/kuzu-memory-export
          GOTOOLCHAIN=auto CGO_ENABLED=1 go build ./... && GOTOOLCHAIN=auto CGO_ENABLED=1 go test ./...
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out,./coverage-ts.out,./coverage-chunking.out
          fail_ci_if_error: false
          verbose: true

  # ── pkg/gleann with the tree-sitter parsers (RFC 004 F) ──
  # The public API's graph paths (GraphDB, the format-2 graph goldens) with
  # tree-sitter CALLS for non-Go languages. Own job: about 95 s without -race
  # on 8 cores, several times that with it, which the test job cannot absorb.
  test-treesitter-pkg:
    name: Test pkg/gleann (treesitter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test (unit, treesitter tag — pkg/gleann)
        run: GOTOOLCHAIN=auto CGO_ENABLED=1 go test -tags treesitter -race -timeout 25m ./pkg/gleann/...
        shell: bash

  # ── RFC 003 step 0: SQLite store on windows/amd64 and linux/arm64 ──
  # The store (internal/store, modernc.org/sqlite + FTS5) was measured only
  # on linux/amd64 in the spike; running its tests on these two platforms is
  # an early reversal gate (RFC 003 sections 7.2, 8 step 0).
  store-sqlite:
    name: Store SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build store
        run: GOTOOLCHAIN=auto go build ./internal/store/
        shell: bash

      - name: Test store (SQLite + FTS5)
        timeout-minutes: 10
        run: GOTOOLCHAIN=auto go test -count=1 -timeout 8m ./internal/store/
        shell: bash

  # ── Build Verification (all platforms, both tags) ────────────
  build-check:
    name: Build (${{ matrix.os }} / ${{ matrix.tags }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tags: ["", "treesitter", "native"]
        exclude:
          # treesitter (CGo) requires C toolchain — skip on Windows for now
          - os: windows-latest
            tags: treesitter
          - os: windows-latest
            tags: native

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Rust (for native tag)
        if: matrix.tags == 'native'
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Core (for native tag)
        if: matrix.tags == 'native'
        run: cd ext/gleann-core-rs && cargo build --release

      - name: Build
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            # Add RPATH for Linux to find the shared library during build-time checks if needed
            # (though -o build_check_bin might skip some runtime checks, ld still needs the lib)
            export CGO_LDFLAGS="-L$(pwd)/ext/gleann-core-rs/target/release"
            go build -tags "${{ matrix.tags }}" -o build_check_bin ./cmd/gleann/
            rm -f build_check_bin
          else
            go build -o build_check_bin ./cmd/gleann/
            rm -f build_check_bin
          fi
        shell: bash

  # ── Documentation Drift Check ────────────────────────────────
  doc-drift:
    name: Doc Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doc-drift detector
        run: bash scripts/doc-drift.sh

  # ── Installer script & pure-Go go install smoke ──────────────
  # scripts/test-install.sh checks install.sh's checksum verification and
  # failure modes entirely offline (file:// fixtures, temp HOME), without
  # sudo. The go install step then proves that `go install ./cmd/gleann`
  # works in the default pure-Go build (CGO_ENABLED=0) and that the installed
  # binary builds and searches a lexical-only index with no model and no
  # network.
  install-smoke:
    name: Install script & go install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh checksums and failure modes
        run: bash scripts/test-install.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go install (CGO_ENABLED=0) and lexical index smoke
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOBIN="$(mktemp -d)"
          go install ./cmd/gleann
          "${GOBIN}/gleann" version

          WORK="$(mktemp -d)"
          export GLEANN_CONFIG_DIR="${WORK}/config"
          export GLEANN_INDEX_DIR="${WORK}/indexes"
          mkdir -p "${WORK}/docs"
          printf 'gleann lexical smoke test alpha beta gamma\n' > "${WORK}/docs/notes.txt"

          "${GOBIN}/gleann" index build smoke --docs "${WORK}/docs" \
            --lexical-only --no-plugins --progress none
          "${GOBIN}/gleann" search smoke "lexical smoke" --json > "${WORK}/results.json"
          grep -q "lexical smoke" "${WORK}/results.json"

  # ── Static Analysis & Vulnerability Scan ─────────────────────
  lint:
    name: Lint & Vuln Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          # Pinned: 2026.2.1 is staticcheck v0.8.1 (prebuilt binary); keep it
          # equal to STATICCHECK_VERSION in the Makefile.
          version: "2026.2.1"
          install-go: false
      - name: govulncheck
        continue-on-error: true
        run: |
          # Pinned: v1.8.0+ need Go 1.26, and this job builds with 1.25.
          # The vulnerability database itself is fetched at run time.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: go mod tidy check
        run: |
          go mod tidy -diff
